name: conversion-ci

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  conversion-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -e .[dev,mcap]
      - name: Run conversion, robustness, and message-package tests
        env:
          PYTHONPATH: .
          PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
        run: |
          pytest -q test/test_converter.py test/test_reader_robustness.py test/test_wheelos_msgs.py
